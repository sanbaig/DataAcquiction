
# ============================
# Bluetooth 蓝牙基本配置
# ============================

# 启用 Bluetooth 协议栈
CONFIG_BT=y

# 启用 BLE Peripheral（外围设备）角色
# 本设备作为传感器端，等待电脑主动连接
CONFIG_BT_PERIPHERAL=y

# 设置 BLE 广播时显示的设备名称
CONFIG_BT_DEVICE_NAME="StretchSense"

# 最大允许连接数设置为 1
# 当前测试只需要一台电脑连接设备
CONFIG_BT_MAX_CONN=1


# ============================
# 日志与调试配置
# ============================

# 启用 printk()，允许通过串口输出调试信息
CONFIG_PRINTK=y

# 启用 Zephyr 日志系统
CONFIG_LOG=y


# ============================
# 系统内存配置
# ============================

# 设置主线程堆栈大小为 2048 字节
CONFIG_MAIN_STACK_SIZE=2048

# 设置系统工作队列线程堆栈大小为 2048 字节
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# GPIO outputs drive the two sensor excitation lines.
CONFIG_GPIO=y

# Enable the nRF52832 SAADC.
CONFIG_ADC=y
CONFIG_ADC_NRFX_SAADC=y